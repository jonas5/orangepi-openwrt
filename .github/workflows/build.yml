name: Build OpenWrt for Orange Pi 4 Pro

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub release'
        required: true
        default: true
        type: boolean
      tag_name:
        description: 'Release tag (leave empty for daily/auto tag)'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'LICENSE'

permissions:
  contents: write

jobs:
  build-openwrt:
    name: Build OpenWrt SD Image (A733 / sun60iw2)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip \
            zlib1g-dev file wget curl zstd dosfstools mtools device-tree-compiler \
            u-boot-tools libelf-dev libyaml-dev pkg-config

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply Orange Pi 4 Pro patches and bootloader
        run: |
          ./scripts/apply-patches.sh openwrt

      - name: Configure OpenWrt
        working-directory: openwrt
        run: |
          cp -v ../configs/orangepi_4pro_defconfig .config
          make defconfig

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j$(nproc)

      - name: Compile OpenWrt
        working-directory: openwrt
        run: |
          export FORCE_UNSAFE_CONFIGURE=1
          make -j$(nproc) || make -j1 V=s

      - name: Package artifacts
        run: |
          mkdir -p release_artifacts
          echo "Collecting built OpenWrt artifacts..."
          find openwrt/bin/targets/sunxi/cortexa53/ -type f \( -name "*.img.gz" -o -name "*.bin" -o -name "*.manifest" \) | while read -r f; do
            echo "Found: $f"
            cp -v "$f" release_artifacts/
          done

          cd release_artifacts
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-orangepi-4-pro
          path: release_artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_release != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_STR=$(date -u +'%Y-%m-%d')
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            PRERELEASE_FLAG=""
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE_FLAG=""
          else
            TAG="daily"
            PRERELEASE_FLAG="--prerelease"
          fi

          cat << 'EOF' > release_notes.md
          ## OpenWrt for Orange Pi 4 Pro (Allwinner A733 / sun60iw2)

          This release provides official OpenWrt firmware for the **Orange Pi 4 Pro (Allwinner A733)** based on mainline **Linux 6.18.y**.

          ### Key Features & Hardware Status:
          - **Kernel**: Mainline Linux 6.18.y with Allwinner PCK-600 power domain controller support.
          - **Ethernet**: Motorcomm YT8531 Gigabit PHY enabled (EEE auto-sleep permanently disabled, 0% packet loss).
          - **Storage**: MicroSD boot partition at 64MB offset to prevent overwriting sun60iw2 boot packages.
          - **Console**: Serial console configured at `ttyS0` @ 115200 baud.
          - **Wi-Fi Notice**: AIC8800 Wi-Fi 6 is omitted from this image and provided separately in the standalone private driver pack.

          ### Flashing:
          ```bash
          zcat openwrt-sunxi-cortexa53-xunlong_orangepi-4-pro-ext4-sdcard.img.gz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync
          ```
          Default IP: `192.168.1.1` on Ethernet (`eth0`).
          EOF

          # Check if release exists; update or create
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $TAG"
            gh release upload "$TAG" release_artifacts/* --clobber
          else
            echo "Creating new release: $TAG"
            gh release create "$TAG" release_artifacts/* \
              --title "OpenWrt for Orange Pi 4 Pro (${TAG})" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi
